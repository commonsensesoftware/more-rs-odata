# [workspace]
# members = ["odata", "odata-*", "examples/*"]
# default-members = ["odata", "odata-*"]
# resolver = "2"

# [workspace.package]
# version = "0.1.0"
# authors = ["Chris Martinez <chris.s.martinez@outlook.com>"]
# license = "MIT"
# repository = "https://github.com/commonsensesoftware/more-rs-odata"
# rust-version = "1.98.0"
# edition = "2024"

# [workspace.dependencies]

[package]
name = "odata-rs"
version = "0.0.1"
edition = "2024"
description = "OData protocol implementation for Rust"
license = "MIT OR Apache-2.0"
homepage = "https://github.com/odata-rs/odata-rs"
repository = "https://github.com/odata-rs/odata-rs"

[workspace]
members = ["crates/csdl-edm", "crates/url", "crates/routing", "crates/service"]
resolver = "2"
default-members = ["crates/csdl-edm", "crates/url", "crates/routing", "crates/service"]

[workspace.package]
version = "0.0.1"

[features]
default = ["full"]
edm = ["dep:csdl_edm"]
url = ["dep:odata_url"]
routing = ["dep:odata_routing"]
service = ["dep:odata_service"]
sqlx-sqlite = ["service", "odata_service/sqlx-sqlite"]
full = ["edm", "url", "routing", "service"]

[dependencies]
csdl_edm = { package = "csdl-edm", path = "crates/csdl-edm", optional = true }
odata_url = { package = "odata-rs-url", path = "crates/url", optional = true }
odata_routing = { package = "odata-rs-routing", path = "crates/routing", optional = true }
odata_service = { package = "odata-rs-service", path = "crates/service", optional = true }

# Examples at the workspace root use these. Cargo always provides
# dev-dependencies to examples, so no `required-features` is needed.
[dev-dependencies]
csdl_edm = { package = "csdl-edm", path = "crates/csdl-edm" }
odata_service = { package = "odata-rs-service", path = "crates/service", features = [
    "sqlx-sqlite",
] }
axum = "0.8.9"
serde = { version = "1", features = ["derive"] }
serde_json = "1"
sqlx = { version = "0.8", default-features = false, features = [
    "runtime-tokio",
    "sqlite",
    "macros",
] }
tokio = { version = "1", features = ["macros", "rt-multi-thread", "net"] }
tower-http = { version = "0.6", features = ["trace"] }
tracing = "0.1"
tracing-subscriber = { version = "0.3", features = ["env-filter"] }


[[example]]
name = "rooms"
path = "examples/rooms/main.rs"
