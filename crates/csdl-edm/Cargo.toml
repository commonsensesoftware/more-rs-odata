[package]
name = "csdl-edm"
version.workspace = true
edition = "2024"

[lib]
name = "csdl_edm"

[features]
default = ["resolver", "validator"]
edm = []
resolver = ["edm"]
validator = ["edm"]

[dependencies]
quick-xml = "0.40.1"
serde = { version = "1", features = ["derive"] }
serde_json = { version = "1.0", features = ["preserve_order", "arbitrary_precision"] }
thiserror = "2.0.18"
unicode-properties = { version = "0.1.4", default-features = false, features = ["general-category"] }
url = "2.5.8"

[dev-dependencies]
rstest = "0.24"
similar = "2"

[[example]]
name = "parse_resolve_validate"
test = true
required-features = ["resolver", "validator"]

[[example]]
name = "edm_graph_demo"
test = true
required-features = ["resolver", "validator"]

[[example]]
name = "url_expansion"
test = true
required-features = ["resolver", "validator"]

[[example]]
name = "csdl_roundtrip"
test = true

[[example]]
name = "cross_format_equivalence"
test = true
