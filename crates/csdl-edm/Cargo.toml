[package]
name = "csdl-edm"
version.workspace = true
edition = "2024"

[lib]
name = "csdl_edm"

[dependencies]
quick-xml = "0.40.1"
serde = { version = "1", features = ["derive"] }
serde_json = { version = "1.0", features = ["preserve_order"] }
thiserror = "2.0.18"

[dev-dependencies]
rstest = "0.24"
similar = "2"

[[example]]
name = "parse_resolve_validate"
test = true

[[example]]
name = "edm_graph_demo"
test = true

[[example]]
name = "url_expansion"
test = true

[[example]]
name = "csdl_roundtrip"
test = true

[[example]]
name = "cross_format_equivalence"
test = true
